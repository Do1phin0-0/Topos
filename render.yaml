# NOTE: Render no longer offers a free-tier Postgres plan, and it has also
# retired the old named tiers (including "starter") for new databases —
# deploying with plan: starter now fails Blueprint validation with
# "Legacy Postgres plans ... are no longer supported for new databases."
# Current plans are named by tier+RAM (e.g. basic-256mb, basic-1gb,
# basic-4gb, pro-4gb). basic-256mb is Render's own default for new
# databases and the cheapest paid option. Still worth confirming in your
# Render dashboard before deploying, since pricing/plan names can change.
databases:
  - name: topos-db
    plan: basic-256mb
    databaseName: topos
    user: topos

services:
  - type: web
    name: topos-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: topos-db
          property: connectionString
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets

  - type: cron
    name: topos-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/run_pipeline.py
    # Every hour, UTC. Cron schedules on Render always run in UTC — adjust
    # for market hours / your timezone as needed.
    schedule: "0 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: topos-db
          property: connectionString
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      # Optional — Reddit/Twitter sentiment are skipped (no error) if left
      # unset. See README for what each needs (Reddit: free registered
      # app; Twitter: paid X API plan).
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      # Optional — institutional-ownership (13F) signals work without this
      # at a low rate limit; set for higher OpenFIGI throughput.
      - key: OPENFIGI_API_KEY
        sync: false
